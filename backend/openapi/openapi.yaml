openapi: 3.1.0
info:
  title: Sprout API
  version: 0.1.0
  description: API for operating and sharing small applications.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Applications
  - name: Identity
  - name: Sharing
paths:
  /api/v1/me:
    get:
      tags: [Identity]
      summary: Resolve the signed-in user and home workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Signed-in Sprout identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Identity provider or database unavailable
  /api/v1/workspaces/{workspaceSlug}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Identity]
      summary: Get a workspace through verified membership
      security:
        - clerkSession: []
      responses:
        "200":
          description: Workspace available to the member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceSlug}/applications:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Applications]
      summary: List applications available to the workspace member
      security:
        - clerkSession: []
      responses:
        "200":
          description: Applications in most-recently-updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Applications]
      summary: Create an application in the workspace
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplication"
      responses:
        "201":
          description: Application created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [Applications]
      summary: Get one application available to the workspace member
      security:
        - clerkSession: []
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Applications]
      summary: Update application details or lifecycle
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplication"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceSlug}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Sharing]
      summary: List current workspace members
      security:
        - clerkSession: []
      responses:
        "200":
          description: Members of this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/access:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [Sharing]
      summary: View application sharing settings as owner or creator
      security:
        - clerkSession: []
      responses:
        "200":
          description: Application access settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sharing]
      summary: Set workspace-wide or restricted application access
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessMode]
              properties:
                accessMode:
                  $ref: "#/components/schemas/ApplicationAccessMode"
      responses:
        "200":
          description: Updated application access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/access/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Sharing]
      summary: Grant or update access for an existing workspace member
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/ApplicationRole"
      responses:
        "200":
          description: Updated application access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sharing]
      summary: Revoke an explicit application grant
      security:
        - clerkSession: []
      responses:
        "200":
          description: Updated application access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces:
    get:
      tags: [Identity]
      summary: List workspaces the authenticated user belongs to
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Membership-scoped workspaces
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Sharing]
      summary: Owner-only list of unexpired, unused invitations (never tokens or hashes)
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Sharing]
      summary: Owner creates an email-bound invitation valid for seven days
      description: Returns the token once with Cache-Control no-store. Store only its SHA-256 digest. No email is sent. At most 100 pending invitations per workspace. Duplicate pending email or existing member returns 409; expired invitations may be replaced.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { type: string, enum: [editor, viewer] }
      responses:
        "201":
          description: Invitation metadata and one-time-display token
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Invitation"
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Sharing]
      summary: Owner revokes a pending invitation
      security: [{ clerkSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/TeamUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/invitations/accept:
    post:
      tags: [Sharing]
      summary: Accept a single-use invitation using the current Clerk-verified primary email
      description: Consume invitation and insert membership in one transaction. Existing membership roles are preserved. Invalid, expired, revoked, used, or email-mismatched links return the same safe 404. Send the token only in the JSON body, never in a URL path or query.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Joined workspace; navigate here, not to the personal workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Fresh verified identity could not be obtained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Sharing]
      summary: Owner changes a non-owner member's workspace role
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [editor, viewer] }
      responses:
        "200": { $ref: "#/components/responses/TeamUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Sharing]
      summary: Owner removes a non-owner member and their application grants
      description: Membership removal, grant cleanup, and revocation of pending invitations for the member's recorded email are atomic. Ownership transfer and owner removal are not supported.
      security: [{ clerkSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/TeamUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token verified by the Go API and mapped to a Sprout user.
  parameters:
    WorkspaceSlug:
      name: workspaceSlug
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ApplicationID:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Invitation:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [editor, viewer] }
        expiresAt: { type: string, format: date-time }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Me:
      type: object
      additionalProperties: false
      required: [id, email, displayName, workspace]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
    ApplicationLifecycle:
      type: string
      enum: [active, paused, archived]
    ApplicationAccessMode:
      type: string
      enum: [workspace, restricted]
    ApplicationRole:
      type: string
      enum: [editor, viewer]
    Application:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, accessMode, lifecycle, defaultHostname, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        accessMode:
          $ref: "#/components/schemas/ApplicationAccessMode"
        lifecycle:
          $ref: "#/components/schemas/ApplicationLifecycle"
        defaultHostname:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationList:
      type: object
      additionalProperties: false
      required: [applications]
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
    Member:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
    MemberList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    ApplicationGrant:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/ApplicationRole"
    ApplicationAccess:
      type: object
      additionalProperties: false
      required: [accessMode, createdBy, grants]
      properties:
        accessMode:
          $ref: "#/components/schemas/ApplicationAccessMode"
        createdBy:
          type: string
          format: uuid
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationGrant"
    CreateApplication:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          maxLength: 63
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 2000
          default: ""
    UpdateApplication:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        lifecycle:
          $ref: "#/components/schemas/ApplicationLifecycle"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
  responses:
    TeamUpdated:
      description: Team change completed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok: { type: boolean, const: true }
    BadRequest:
      description: Invalid path, body, or lifecycle transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid Clerk session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Workspace role does not permit this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Workspace or application not available to this identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Application slug, member, or pending invitation already exists, or invitation capacity reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected internal failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
