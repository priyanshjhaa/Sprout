openapi: 3.1.0
info:
  title: Sprout API
  version: 0.1.0
  description: API for operating and sharing small applications.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Applications
  - name: Identity
  - name: Sharing
paths:
  /api/v1/me:
    get:
      tags: [Identity]
      summary: Resolve the signed-in user and home workspace
      security:
        - clerkSession: []
      responses:
        "200":
          description: Signed-in Sprout identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Identity provider or database unavailable
  /api/v1/capabilities:
    get:
      summary: Optional features this API process offers
      description: Clients ask here rather than inferring features from 404s. localBuilds is true only when SPROUT_ENABLE_LOCAL_BUILDS=1.
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Feature flags for this process
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [localBuilds]
                properties:
                  localBuilds: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/workspaces/{workspaceSlug}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Identity]
      summary: Get a workspace through verified membership
      security:
        - clerkSession: []
      responses:
        "200":
          description: Workspace available to the member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceSlug}/applications:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Applications]
      summary: List applications available to the workspace member
      security:
        - clerkSession: []
      responses:
        "200":
          description: Applications in most-recently-updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Applications]
      summary: Create an application in the workspace
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplication"
      responses:
        "201":
          description: Application created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [Applications]
      summary: Get one application available to the workspace member
      security:
        - clerkSession: []
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Applications]
      summary: Update application details or lifecycle
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplication"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{workspaceSlug}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Sharing]
      summary: List current workspace members
      security:
        - clerkSession: []
      responses:
        "200":
          description: Members of this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/access:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [Sharing]
      summary: View application sharing settings as owner or creator
      security:
        - clerkSession: []
      responses:
        "200":
          description: Application access settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sharing]
      summary: Set workspace-wide or restricted application access
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessMode]
              properties:
                accessMode:
                  $ref: "#/components/schemas/ApplicationAccessMode"
      responses:
        "200":
          description: Updated application access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/access/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Sharing]
      summary: Grant or update access for an existing workspace member
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/ApplicationRole"
      responses:
        "200":
          description: Updated application access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sharing]
      summary: Revoke an explicit application grant
      security:
        - clerkSession: []
      responses:
        "200":
          description: Updated application access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAccess"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces:
    get:
      tags: [Identity]
      summary: List workspaces the authenticated user belongs to
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Membership-scoped workspaces
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Sharing]
      summary: Owner-only list of unexpired, unused invitations (never tokens or hashes)
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Sharing]
      summary: Owner creates an email-bound invitation valid for seven days
      description: Returns the token once with Cache-Control no-store. Store only its SHA-256 digest. No email is sent. At most 100 pending invitations per workspace. Duplicate pending email or existing member returns 409; expired invitations may be replaced.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { type: string, enum: [editor, viewer] }
      responses:
        "201":
          description: Invitation metadata and one-time-display token
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Invitation"
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Sharing]
      summary: Owner revokes a pending invitation
      security: [{ clerkSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/TeamUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/invitations/accept:
    post:
      tags: [Sharing]
      summary: Accept a single-use invitation using the current Clerk-verified primary email
      description: Consume invitation and insert membership in one transaction. Existing membership roles are preserved. Invalid, expired, revoked, used, or email-mismatched links return the same safe 404. Send the token only in the JSON body, never in a URL path or query.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Joined workspace; navigate here, not to the personal workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Fresh verified identity could not be obtained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Sharing]
      summary: Owner changes a non-owner member's workspace role
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [editor, viewer] }
      responses:
        "200": { $ref: "#/components/responses/TeamUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Sharing]
      summary: Owner removes a non-owner member and their application grants
      description: Membership removal, grant cleanup, and revocation of pending invitations for the member's recorded email are atomic. Ownership transfer and owner removal are not supported.
      security: [{ clerkSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/TeamUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployment-simulations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
    post:
      summary: Queue an explicitly simulated deployment (no application code runs)
      description: Requires application edit permission and an active application. Two process-owned workers, eight waiting slots, one accepted job per application. Queue saturation returns 503 with Retry-After. Closing the request after acceptance does not cancel the job. No automatic retry or idempotency-key replay is provided; after an ambiguous response, list jobs before resubmitting.
      security: [{ clerkSession: [] }]
      requestBody: { $ref: "#/components/requestBodies/EmptySimulationInput" }
      responses:
        "201":
          description: Persisted queued simulation; Location identifies the job
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Application inactive or already has an accepted simulation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/SimulationUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      summary: List the latest 50 simulations for an application the actor can view
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Newest-first simulations with typed stages, not runtime logs
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    maxItems: 50
                    items: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployment-simulations/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - $ref: "#/components/parameters/SimulationId"
    get:
      summary: Inspect simulation progress through current application permissions
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Simulation state and ordered source/build/package stages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployment-simulations/{deploymentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - $ref: "#/components/parameters/SimulationId"
    post:
      summary: Cancel queued or running simulation work (application editors only)
      description: Persist cancellation before signalling the worker. Terminal jobs return 409 and cannot be overwritten by late completion. An application's slot is released once its worker observes cancellation.
      security: [{ clerkSession: [] }]
      requestBody: { $ref: "#/components/requestBodies/EmptySimulationInput" }
      responses:
        "200":
          description: Cancelled simulation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Simulation already terminal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployment-simulations/{deploymentId}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - $ref: "#/components/parameters/SimulationId"
      - in: header
        name: Last-Event-ID
        description: Optional SHA-256 snapshot cursor from a previous progress event. Deduplicates identical snapshots; does not replay historical events.
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    get:
      summary: Stream authorized simulation snapshots with server-sent events
      security: [{ clerkSession: [] }]
      description: |
        Uses the Authorization bearer header, never a token in the URL. Each progress
        event carries a complete DeploymentSimulation JSON snapshot and a hash id.
        Intermediate snapshots may be coalesced. The complete event carries {} and
        ends a terminal job's stream, including when its snapshot cursor matches.
        The unavailable event carries {"code":"progress_unavailable"} and closes
        the stream after a permission or dependency failure; the client must stop
        displaying stale progress and re-fetch through normal authenticated APIs.
        Comment heartbeats trigger authorization rechecks every 10 seconds.
        Connections end after 25 seconds or token expiry, whichever is earlier.
        Reconnect with a fresh token and the last snapshot id; retry hint is 1000ms.
        Limits are 4 streams per user and 128 per process. Disconnecting does not
        cancel a job. No raw build logs or durable event history are retained here.
      responses:
        "200":
          description: SSE progress, complete, unavailable events and heartbeat comments
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Stream capacity reached (Retry-After 3 seconds) or streaming unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployments:
    description: |
      Real builds. These paths exist only when the API runs with
      SPROUT_ENABLE_LOCAL_BUILDS=1 on a loopback address; otherwise they return 404.
      Uploaded code runs in a sealed Docker container on the API's own machine, so
      this is local developer tooling, not a hosted service. A succeeded build
      means the output was built and stored; nothing is started and no URL is live.
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
    post:
      summary: Upload a source archive and queue a real build of it
      description: |
        Requires application edit permission, an active application, and a free
        queue slot; these are checked before the body is read. The body is a plain,
        uncompressed tar of at most 16 MiB that follows the Node.js application
        contract (node-build-contract.md). Stages: source (extract and validate),
        build (sealed Docker build), package (store the output). The uploaded
        archive is deleted when the job ends, whatever its outcome. Failures use
        stable codes such as node_contract_invalid or source_sensitive_path.
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary, maxLength: 16777216 }
      responses:
        "201":
          description: Persisted queued build; Location identifies the job
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Application inactive or already has an accepted deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: Archive larger than 16 MiB (code source_too_large)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: Content-Type is not application/x-tar (code unsupported_media_type)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/SimulationUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      summary: List the latest 50 real builds for an application the actor can view
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Newest-first builds with typed stages; never simulations
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    maxItems: 50
                    items: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - $ref: "#/components/parameters/SimulationId"
    get:
      summary: Inspect a real build through current application permissions
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Build state and ordered source/build/package stages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployments/{deploymentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - $ref: "#/components/parameters/SimulationId"
    post:
      summary: Cancel a queued or running build (application editors only)
      description: Cancellation is persisted first; the build container is then stopped and removed, and any output is deleted.
      security: [{ clerkSession: [] }]
      requestBody: { $ref: "#/components/requestBodies/EmptySimulationInput" }
      responses:
        "200":
          description: Cancelled build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Build already terminal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/workspaces/{workspaceSlug}/applications/{applicationId}/deployments/{deploymentId}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ApplicationID"
      - $ref: "#/components/parameters/SimulationId"
      - in: header
        name: Last-Event-ID
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    get:
      summary: Stream authorized build snapshots with server-sent events
      description: Same contract as the simulation events stream, for real builds.
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: SSE progress, complete, unavailable events and heartbeat comments
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Stream capacity reached (Retry-After 3 seconds) or streaming unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  requestBodies:
    EmptySimulationInput:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token verified by the Go API and mapped to a Sprout user.
  parameters:
    SimulationId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceSlug:
      name: workspaceSlug
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ApplicationID:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DeploymentSimulation:
      type: object
      additionalProperties: false
      required: [id, applicationId, simulated, status, failureCode, createdAt, startedAt, finishedAt, stages]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        simulated: { type: boolean, const: true }
        status: { type: string, enum: [queued, building, succeeded, failed, cancelled] }
        failureCode:
          type: [string, "null"]
          enum: [null, job_cancelled, server_shutdown, job_timeout, worker_panic, start_rejected, progress_unavailable, simulated_step_failed, process_interrupted]
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        stages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status, failureCode]
            properties:
              name: { type: string, enum: [source, build, package] }
              status: { type: string, enum: [pending, running, succeeded, failed, skipped] }
              failureCode: { type: [string, "null"] }
    Invitation:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [editor, viewer] }
        expiresAt: { type: string, format: date-time }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Me:
      type: object
      additionalProperties: false
      required: [id, email, displayName, workspace]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
    ApplicationLifecycle:
      type: string
      enum: [active, paused, archived]
    ApplicationAccessMode:
      type: string
      enum: [workspace, restricted]
    ApplicationRole:
      type: string
      enum: [editor, viewer]
    Application:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, accessMode, lifecycle, defaultHostname, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        accessMode:
          $ref: "#/components/schemas/ApplicationAccessMode"
        lifecycle:
          $ref: "#/components/schemas/ApplicationLifecycle"
        defaultHostname:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationList:
      type: object
      additionalProperties: false
      required: [applications]
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
    Member:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
    MemberList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    ApplicationGrant:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/ApplicationRole"
    ApplicationAccess:
      type: object
      additionalProperties: false
      required: [accessMode, createdBy, grants]
      properties:
        accessMode:
          $ref: "#/components/schemas/ApplicationAccessMode"
        createdBy:
          type: string
          format: uuid
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationGrant"
    CreateApplication:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          maxLength: 63
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 2000
          default: ""
    UpdateApplication:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        lifecycle:
          $ref: "#/components/schemas/ApplicationLifecycle"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
  responses:
    SimulationUnavailable:
      description: Queue full or simulation worker unavailable; no new job accepted
      headers:
        Retry-After:
          description: Present when the queue is full
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TeamUpdated:
      description: Team change completed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok: { type: boolean, const: true }
    BadRequest:
      description: Invalid path, body, or lifecycle transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid Clerk session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Workspace role does not permit this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Workspace or application not available to this identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Application slug, member, or pending invitation already exists, or invitation capacity reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected internal failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
